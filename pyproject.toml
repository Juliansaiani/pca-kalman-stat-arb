[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pca-kalman-stat-arb"
version = "0.1.0"
description = "Statistical arbitrage equity residual reversal with rolling PCA, adaptive Kalman filter and risk sizing"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Julian Saiani", email = "juliansaiapro@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
]

[project.scripts]
stat-arb-study = "equity_stat_arb.period_comparison:main"
equity-study = "equity_stat_arb.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
