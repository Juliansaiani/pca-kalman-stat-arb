[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-stat-arb"
version = "0.1.0"
description = "Equity residual reversal with rolling PCA, adaptive exposures and risk sizing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4", "pyarrow>=17", "yfinance>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6"]

[project.scripts]
equity-study = "equity_stat_arb.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
